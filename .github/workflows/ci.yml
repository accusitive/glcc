name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The C compiler: everything outside the fern family. Green here means
  # glcc passes; fern breakage shows up only in the `fern` job below.
  glcc:
    name: glcc (${{ matrix.name }})
    strategy:
      fail-fast: false # a Windows failure must not cancel Linux
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, timeout: 20 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, timeout: 20 }
          - { name: windows-x86_64, os: windows-2025, timeout: 30 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # The C compiler needs no submodules: edg-sys skips EDG without the
      # cxx feature, and the test-suite submodules are 2+ GB. Never pass
      # --all-features (it would turn on cxx/EDG). Pin runner labels so an
      # image migration cannot silently change the job.
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up MSVC (link.exe/lib.exe on PATH, LIB set)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: glcc-${{ matrix.name }}
          # PRs restore but never write: keep the 10 GB repo cache budget
          # for master runs.
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      # The `glcc` binary itself is built by this command, so fernc-style
      # driver tests inside the workspace find it next to the test binaries.
      - name: Build and test
        run: cargo test --workspace --exclude fern --exclude fernc --exclude fern_exec --exclude fern_repl --locked
      # Compile and run a C program through the driver, end to end.
      # build.rs staged glccrt.o and cc is present on the Linux runners.
      - name: C driver smoke test
        if: runner.os != 'Windows'
        run: |
          printf '#include <stdio.h>\nint main(void) { puts("smoke-ok"); return 0; }\n' > "$RUNNER_TEMP/smoke.c"
          cargo run -q --locked -- "$RUNNER_TEMP/smoke.c" -o "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke"
      # Windows link+run smoke: enable once proven green. It exercises
      # link.exe + the CRT end to end, which no test in the suite does.
      # - name: C driver smoke test
      #   if: runner.os == 'Windows'
      #   run: |
      #     Set-Content $env:RUNNER_TEMP\smoke.c "#include <stdio.h>`nint main(void) { puts(`"smoke-ok`"); return 0; }"
      #     cargo run -q --locked -- $env:RUNNER_TEMP\smoke.c -o $env:RUNNER_TEMP\smoke.exe
      #     & $env:RUNNER_TEMP\smoke.exe; if ($LASTEXITCODE -ne 0) { exit 1 }

  # The ML frontend and its crates. fernc's aarch64 path is unproven, so no
  # aarch64 runner here. fern's JIT tests never ran in CI before this split
  # (they were excluded on Linux and compiled out on Windows); this job runs
  # them for the first time on Linux.
  fern:
    name: fern (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, timeout: 20 }
          - { name: windows-x86_64, os: windows-2025, timeout: 20 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up MSVC (link.exe/lib.exe on PATH, LIB set)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: fern-${{ matrix.name }}
          # PRs restore but never write: keep the 10 GB repo cache budget
          # for master runs.
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      # fernc's link tests invoke glcc, which is a separate binary in the
      # workspace and therefore is not built by `cargo test -p fernc`.
      - name: Build glcc and fernc
        run: cargo build -p glcc -p fernc --locked
      - name: Build and test
        if: runner.os != 'Windows'
        run: cargo test -p fern -p fernc -p fern_exec -p fern_repl --locked
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Append Git Bash after MSVC: `usr/bin/link.exe` is coreutils and
          # would otherwise shadow MSVC's linker during the tests.
          $env:PATH = "$env:PATH;C:\Program Files\Git\usr\bin;C:\Program Files\Git\bin"
          cargo test -p fern -p fernc -p fern_exec -p fern_repl --locked
      # tools/fernmake/build.ps1 builds fernmake with fernc + glcc from the
      # debug tree (built above) and runs the demo; the loop then drives the
      # PowerShell makefiles in the examples. This is the end-to-end path
      # Windows users take through the examples.
      - name: Build and run fern examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location tools/fernmake
          .\build.ps1 run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          foreach ($dir in @("brainfuck", "modules", "showcase")) {
            Push-Location "examples/fern/$dir"
            & "$env:GITHUB_WORKSPACE\tools\fernmake\build\fernmake.exe" Makefile.win
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$env:GITHUB_WORKSPACE\tools\fernmake\build\fernmake.exe" Makefile.win run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
      # Windows link+run smoke: enable once proven green. It exercises
      # link.exe + the CRT end to end, which no test in the suite does.
      # - name: C driver smoke test
      #   if: runner.os == 'Windows'
      #   run: |
      #     Set-Content $env:RUNNER_TEMP\smoke.c "#include <stdio.h>`nint main(void) { puts(`"smoke-ok`"); return 0; }"
      #     cargo run -q --locked -- $env:RUNNER_TEMP\smoke.c -o $env:RUNNER_TEMP\smoke.exe
      #     & $env:RUNNER_TEMP\smoke.exe; if ($LASTEXITCODE -ne 0) { exit 1 }

  # End-to-end C compiler check: build SQLite from source with glcc and run
  # its in-house veryquick suite (333k tests, ~10 minutes).
  sqlite:
    name: sqlite (veryquick)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sqlite
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      # tclsh runs the suite; the headers build the testfixture.
      - name: Install Tcl
        run: sudo apt-get update && sudo apt-get install -y tcl tcl-dev
      - name: Build glcc
        run: cargo build --locked
      - name: SQLite veryquick suite
        run: tests/sqlite/download-sqlite.sh

  # The Windows half of the SQLite check: run-windows.ps1 builds Tcl 8.6
  # and the MSVC testfixture itself, recompiles the amalgamation with glcc,
  # and runs veryquick. It is allowed to fail until the path is proven green
  # on the hosted image; flip continue-on-error once it is.
  sqlite-windows:
    name: sqlite (veryquick, windows)
    runs-on: windows-2025
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up MSVC (link.exe/lib.exe on PATH, LIB set)
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: sqlite-windows
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
      - name: Build glcc
        run: cargo build --locked
      - name: SQLite veryquick suite
        shell: pwsh
        run: tests/sqlite/run-windows.ps1
