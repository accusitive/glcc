[workspace]
members = ["crates/glcc_frontend", "crates/glcpp", "crates/edg-sys", "crates/glcc_mir", "crates/glcc_dwarf", "crates/glcc_lower_cl", "crates/glcc_lower_mir", "crates/abi_probe", "crates/glcc_explorer", "crates/glcc_pp", "crates/glcc_toolchain", "crates/fern", "crates/fernc"]

[package]
name = "glcc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
glcc_frontend = { path = "crates/glcc_frontend" }
glcc_pp = { path = "crates/glcc_pp" }
glcc_mir = { path = "crates/glcc_mir" }
glcc_lower_mir = { path = "crates/glcc_lower_mir" }
glcc_lower_cl = { path = "crates/glcc_lower_cl" }
glcc_dwarf = { path = "crates/glcc_dwarf" }
cranelift-codegen = { version = "0.136.0", default-features = false, features = ["x86", "arm64", "riscv64"] }
cranelift-module = "0.136.0"
cranelift-native = "0.136.0"
cranelift-object = "0.136.0"
# Object read/write for patching 32-bit (`__ptr32`) data relocations the
# Cranelift data machinery cannot express.
object = { version = "0.40.0", default-features = false, features = ["write", "std"] }

[build-dependencies]
# clang / `lib.exe` discovery for the Win64 runtime staging in build.rs.
glcc_toolchain = { path = "crates/glcc_toolchain" }

[dev-dependencies]
# DWARF read-back in driver tests (`-g` object contents).
gimli = { version = "0.33.0", default-features = false, features = ["read"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "coff", "std"] }

[profile.release]
# debug = true       # Tells the compiler to include debug symbols
# strip = false      # Ensures symbols aren't stripped out by the linker

strip = true
lto = true
# Browser module (`tools/build-wasm.sh`): small and abort-on-panic; the panic
# hook still runs before the trap so the page can show the message.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
#codegen-units = 1 #Uncomment this for slightly better optimizations on the WASM pack
panic = "abort"
debug = false
strip = true
