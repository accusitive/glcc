[workspace]
members = ["crates/glcc_frontend", "crates/glcc_cxx", "crates/edg-sys", "crates/glcc_mir", "crates/glcc_dwarf", "crates/glcc_lower_cl", "crates/glcc_lower_mir", "crates/glcc_codegen", "crates/glcc_prism", "crates/abi_probe", "crates/glcc_explorer", "crates/glcc_pp", "crates/glcc_toolchain", "crates/glasm", "crates/glasm_data", "crates/fern", "crates/fernc", "crates/fern_exec", "crates/fern_repl"]

[package]
name = "glcc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
# Code generators. Each can be compiled out to drop its crate tree:
# the native backend is the small, dependency-free default; the
# Cranelift backend is the production one (`--features cranelift`).
# At least one must be enabled.
default = ["native"]
cranelift = [
    "dep:glcc_lower_cl",
    "dep:glcc_dwarf",
    "dep:cranelift-codegen",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:cranelift-object",
    "dep:object",
]
native = ["dep:glcc_codegen"]

[dependencies]
glasm = { path = "crates/glasm" }
glcc_frontend = { path = "crates/glcc_frontend" }
glcc_pp = { path = "crates/glcc_pp" }
glcc_mir = { path = "crates/glcc_mir" }
glcc_lower_mir = { path = "crates/glcc_lower_mir" }
glcc_prism = { path = "crates/glcc_prism" }
glcc_lower_cl = { path = "crates/glcc_lower_cl", optional = true }
glcc_codegen = { path = "crates/glcc_codegen", optional = true }
glcc_dwarf = { path = "crates/glcc_dwarf", optional = true }
cranelift-codegen = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype", default-features = false, features = ["x86", "arm64", "riscv64"], optional = true }
cranelift-module = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype", optional = true }
cranelift-native = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype", optional = true }
cranelift-object = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype", optional = true }
# Object read/write for patching 32-bit (`__ptr32`) data relocations the
# Cranelift data machinery cannot express (and the tests' object reading).
object = { version = "0.40.0", default-features = false, features = ["write", "std"], optional = true }

[build-dependencies]
# clang / `lib.exe` discovery for the Win64 runtime staging in build.rs.
glcc_toolchain = { path = "crates/glcc_toolchain" }

[dev-dependencies]
# DWARF read-back in driver tests (`-g` object contents).
gimli = { version = "0.33.0", default-features = false, features = ["read"] }
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "coff", "std"] }

[profile.release]
# debug = true       # Tells the compiler to include debug symbols
# strip = false      # Ensures symbols aren't stripped out by the linker

strip = true
lto = true
# Browser module (`tools/build-wasm.sh`): small and abort-on-panic; the panic
# hook still runs before the trap so the page can show the message.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
#codegen-units = 1 #Uncomment this for slightly better optimizations on the WASM pack
panic = "abort"
debug = false
strip = true
