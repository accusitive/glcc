[package]
name = "glcc_explorer"
version = "0.1.0"
edition = "2024"

# Godbolt-style inspector: C source in, MIR and assembly out.
# Native: library + `glcc-explorer` binary (CLI and HTTP server).
# wasm32: library only; `tools/build-wasm.sh` produces the browser module
# whose page asks the server for objdump output over /disasm.

[features]
default = ["server"]
# The CLI and its HTTP server; not available on wasm32.
server = []

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
glcc_frontend = { path = "../glcc_frontend" }
glcc_pp = { path = "../glcc_pp" }
glcc_mir = { path = "../glcc_mir" }
glcc_lower_mir = { path = "../glcc_lower_mir" }
glcc_lower_cl = { path = "../glcc_lower_cl" }
cranelift-codegen = { version = "0.136.0", default-features = false, features = ["x86", "arm64", "riscv64"] }
cranelift-module = "0.136.0"
cranelift-native = "0.136.0"
cranelift-object = "0.136.0"

[[bin]]
name = "glcc-explorer"
path = "src/main.rs"
required-features = ["server"]
