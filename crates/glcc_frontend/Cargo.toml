[package]
name = "glcc_frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
codespan-reporting = { version = "0.13.1", default-features = false }
hashbrown = { version = "0.16", default-features = false, features = ["default-hasher"] }
peekmore = "1.3.0"
rustc_apfloat = "0.2"
string-interner = { version = "0.20.0", default-features = false, features = ["backends"] }

[features]
default = ["std"]
std = [
    "codespan-reporting/std",
    "codespan-reporting/termcolor",
    "string-interner/std",
]
