[package]
name = "glcc_lower_cl"
version = "0.1.0"
edition = "2024"

# MIR -> Cranelift lowering. Backend-agnostic MIR goes in and Clif
# functions come out; the caller picks the Cranelift module (object for
# the real pipeline, JIT in tests).

[dependencies]
glcc_mir = { path = "../glcc_mir" }
glcc_dwarf = { path = "../glcc_dwarf" }
cranelift-codegen = { path = "/home/gl/data/p/wasmtime-asm/cranelift/codegen", default-features = false, features = ["x86", "arm64", "riscv64", "unwind"] }
cranelift-frontend = { path = "/home/gl/data/p/wasmtime-asm/cranelift/frontend" }
cranelift-module = { path = "/home/gl/data/p/wasmtime-asm/cranelift/module" }
smallvec = "1.16.3"

[dev-dependencies]
cranelift-jit = { path = "/home/gl/data/p/wasmtime-asm/cranelift/jit" }
cranelift-native = { path = "/home/gl/data/p/wasmtime-asm/cranelift/native" }
cranelift-object = { path = "/home/gl/data/p/wasmtime-asm/cranelift/object" }
object = "0.40.0"
