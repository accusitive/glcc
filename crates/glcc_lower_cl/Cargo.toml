[package]
name = "glcc_lower_cl"
version = "0.1.0"
edition = "2024"

# MIR -> Cranelift lowering. Backend-agnostic MIR goes in and Clif
# functions come out; the caller picks the Cranelift module (object for
# the real pipeline, JIT in tests).

[dependencies]
glcc_mir = { path = "../glcc_mir" }
glcc_dwarf = { path = "../glcc_dwarf" }
cranelift-codegen = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype", default-features = false, features = ["x86", "arm64", "riscv64", "unwind"] }
cranelift-frontend = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype" }
cranelift-module = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype" }
smallvec = "1.16.3"

[dev-dependencies]
cranelift-jit = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype" }
cranelift-native = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype" }
cranelift-object = { git = "https://github.com/accusitive/wasmtime", branch = "inline-asm-prototype" }
object = "0.40.0"
